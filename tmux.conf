#setting the delay between prefix and command
set -s escape-time 1
# Reload the file with Prefix r
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# moving between panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# Quick pane selection
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+
# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# mouse support - set to on if you want to use the mouse
# set-option -g mouse on

# Set the default terminal mode to 256color mode
# tmux-256color supports italics; screen-256color does not (terminfo `sitm`).
# Older distros may not ship tmux-256color, so fall back where it's absent.
if-shell 'infocmp tmux-256color > /dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'

# Pass truecolor through to programs running inside tmux, so 24-bit colours
# aren't approximated down to the 256-colour palette.
set -ga terminal-overrides ",*:Tc"

# enable activity alerts
setw -g monitor-activity on
set -g visual-activity on

# Update the status bar every sixty seconds
# set -g status-interval 60

# Center the window list
set -g status-justify centre

# Enable vi keys.
setw -g mode-keys vi

# Expand the scrollback buffer
set -g history-limit 100000

# shortcut for synchronize-panes toggle
bind C-s set-window-option synchronize-panes

# Log output to a text file on demand
bind P pipe-pane -o "cat >>~/#W.log" \; display "Toggled logging to ~/#W.log"

# Clear scrollback buffer
bind -n C-k clear-history
bind b send-keys -R \; clear-history

# set -g default-command 'reattach-to-user-namespace $SHELL --login'
bind -r y send-keys -t 'palco:compiler' 'rebuild_app' Enter
bind -r B send-keys -t 'palco:logs' -R \; clear-history
